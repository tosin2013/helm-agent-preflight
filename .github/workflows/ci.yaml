name: CI

on:
  push:
    branches:
      - main
      - "release-**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check license headers
        run: bash scripts/validate-license.sh

      - name: Build
        run: make build

      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install golangci-lint (built with Go 1.26)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.1"

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.71.1"
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Build binary
        run: make build

      - name: Run acceptance tests
        run: make test-integration
        env:
          POLICY_DIR: ${{ github.workspace }}/policies/rego

  cross-compile:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cross-compile
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-w -s" \
            -o "bin/preflight-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/preflight

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  record-demos:
    name: Record Demo GIFs (VHS)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install VHS
        run: go install github.com/charmbracelet/vhs@latest

      - name: Install Conftest
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Build binary
        run: make build

      - name: Record demos
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          vhs demos/offline.tape
          vhs demos/agent.tape

      - name: Upload demo GIFs
        uses: actions/upload-artifact@v4
        with:
          name: demo-recordings
          path: demos/*.gif
          retention-days: 30
