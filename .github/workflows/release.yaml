#
# Release workflow — triggered by semver tags (v*.*.*).
# Builds platform binaries, generates checksums, and publishes a GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME}"
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-w -s \
            -X github.com/tosin2013/helm-agent-preflight/internal/version.Version=${VERSION} \
            -X github.com/tosin2013/helm-agent-preflight/internal/version.GitCommit=${GIT_COMMIT} \
            -X github.com/tosin2013/helm-agent-preflight/internal/version.GitTreeState=clean"
          mkdir -p bin
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              output="bin/preflight-${os}-${arch}${ext}"
              echo "Building ${output}..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -trimpath \
                -ldflags="${LDFLAGS}" \
                -o "${output}" \
                ./cmd/preflight
            done
          done
          ls -lh bin/

      - name: Generate checksums
        run: |
          cd bin
          sha256sum preflight-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "helm-agent-preflight $GITHUB_REF_NAME" \
            --generate-notes \
            bin/preflight-linux-amd64 \
            bin/preflight-linux-arm64 \
            bin/preflight-darwin-amd64 \
            bin/preflight-darwin-arm64 \
            bin/preflight-windows-amd64.exe \
            bin/sha256sums.txt
        env:
          GH_TOKEN: ${{ github.token }}
