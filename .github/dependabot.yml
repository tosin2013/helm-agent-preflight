# Dependabot configuration — weekly automated dependency updates.
# Note: Dependabot PRs are exempt from the DCO sign-off requirement
# since Dependabot cannot use `git commit -s`. See CONTRIBUTING.md.
version: 2
updates:
  # Go module dependencies (cobra, testify, sigs.k8s.io/yaml, …)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"

  # GitHub Actions (checkout, setup-go, codecov, upload-artifact, setup-helm, …)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
